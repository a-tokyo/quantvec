name: Release & Publish

# Publishes to npm + creates a GitHub release when package.json version changes on main.
# v0.1.0 uses NPM_TOKEN (proven path); npm provenance via OIDC trusted publishing is a
# fast-follow once the package exists (id-token permission is already reserved below).

on:
  push:
    branches: [main]

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Publish to npm + GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
      - run: bun install --frozen-lockfile
      - run: bun run build:wasm
      - run: bun run build

      - name: Determine whether to publish
        id: check
        run: |
          NAME=$(node -p "require('./package.json').name")
          VER=$(node -p "require('./package.json').version")
          if [ "$VER" = "0.0.0" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif npm view "$NAME@$VER" version >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "version=$VER" >> "$GITHUB_OUTPUT"
          fi

      - name: GitHub Release
        if: steps.check.outputs.publish == 'true'
        uses: ncipollo/release-action@v1
        with:
          tag: v${{ steps.check.outputs.version }}
          name: v${{ steps.check.outputs.version }}
          generateReleaseNotes: true

      - name: npm publish
        if: steps.check.outputs.publish == 'true'
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
